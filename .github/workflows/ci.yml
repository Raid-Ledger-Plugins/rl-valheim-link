name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 1. The pinned copy of the contract must match Raid Ledger main byte for byte. Fails loudly on drift.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Diff contract/v1 against Raid Ledger main
        run: tools/contract-check/drift-check.sh

  # 2. Fixture validation: ALWAYS runs, with or without game assemblies.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: ajv — golden fixtures and the mod's own fixtures validate against schema.json
        run: |
          cd tools/contract-check && npm ci --no-audit --no-fund
          node validate.mjs ../../contract/v1/fixtures
          node validate.mjs ../../fixtures
          node validate.mjs --expect-invalid ../../contract/v1/fixtures/invalid
      - name: Install mock-ingest (the uploader tests spawn it with node)
        run: cd tools/mock-ingest && npm ci --no-audit --no-fund
      - name: CSharp pre-send validator — tests (golden pass, invalid rejected per EXPECTED.json, fixtures reproduce, uploader vs mock)
        run: dotnet test tests/RlValheimLink.Contract.Tests -nologo
      - name: CSharp pre-send validator — CLI over fixtures (with bitmap inflate) and the invalid set
        run: |
          dotnet run --project tools/validate-cli -- --inflate fixtures
          dotnet run --project tools/validate-cli -- --inflate contract/v1/fixtures
          dotnet run --project tools/validate-cli -- --expect-invalid contract/v1/fixtures/invalid
      - name: mock-ingest accepts the fixtures and enforces token / serverId / caps / 429
        run: cd tools/mock-ingest && npm test
      - name: Record
        run: echo "fixture validation (ajv + CSharp validator + mock-ingest) ran" >> "$GITHUB_STEP_SUMMARY"

  # 3. Compile the plugin when game assemblies can be provided (Digitalroot.Valheim.Common.References on NuGet).
  #    Restore failure = skipped (recorded), not a red build; a COMPILE error is red.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the shipped-files diff below needs the merge base with the PR's base branch
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Version consistent (thunderstore.toml = Directory.Build.props = Plugin.Version) and changelog has it
        run: |
          node tools/thunderstore/check.mjs consistent
          node tools/thunderstore/check.mjs changelog
      # Only PRs that change what ships need a new version (mirrors the modpack's validate.yml).
      - name: Version was bumped if shipped files changed (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          shipped=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- src thunderstore.toml thunderstore/README.md thunderstore/icon.png CHANGELOG.md LICENSE)
          if [ -z "$shipped" ]; then echo "No shipped files changed; no version bump needed."; exit 0; fi
          echo "Shipped files changed:"; echo "$shipped"
          if git show "origin/${{ github.base_ref }}:thunderstore.toml" > /tmp/base.toml 2>/dev/null; then
            node tools/thunderstore/check.mjs bumped /tmp/base.toml
          else
            echo "thunderstore.toml does not exist on ${{ github.base_ref }} yet; nothing to compare against"
          fi
          if node tools/thunderstore/check.mjs published; then echo "::error::this version is already on Thunderstore"; exit 1; fi
      - name: Restore (game assemblies from NuGet)
        id: restore
        continue-on-error: true
        run: dotnet restore src/RlValheimLink/RlValheimLink.csproj
      - name: Build plugin
        if: steps.restore.outcome == 'success'
        run: dotnet build src/RlValheimLink/RlValheimLink.csproj -c Release --no-restore -warnaserror
      - name: Record
        run: |
          if [ "${{ steps.restore.outcome }}" = "success" ]; then
            echo "plugin: COMPILED against Digitalroot.Valheim.Common.References (NuGet) + BepInEx.Core 5.4.21" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "plugin: NOT compiled — game assemblies could not be restored (feed down?); fixture validation still ran" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the Thunderstore package (same layout release.yml publishes)
        if: steps.restore.outcome == 'success'
        run: |
          dotnet tool install --global tcli --version 0.2.4
          tools/thunderstore/stage.sh
          tcli build
      - name: Upload the package zip
        if: steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GamerSaloon-ValheimLink-${{ github.sha }}
          path: build/*.zip
          if-no-files-found: error
