        run: |
          props=$(sed -n 's#.*<ModVersion>\(.*\)</ModVersion>.*#\1#p' Directory.Build.props)
          code=$(sed -n 's#.*public const string Version = "\(.*\)";.*#\1#p' src/RlValheimLink/Plugin.cs)
          echo "props=$props code=$code"; [ "$props" = "$code" ]
      - name: Restore (game assemblies from NuGet)
        id: restore
        continue-on-error: true
        run: dotnet restore src/RlValheimLink/RlValheimLink.csproj
      - name: Build plugin
